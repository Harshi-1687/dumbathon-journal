<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Friction Log</title>
<link rel="stylesheet" href="journal.css">
</head>

<body>

<div class="container">

<header>

<h1>FRICTION.LOG</h1>

<div class="status">
<span>HEARTBEAT: <b id="heartbeat">60</b>s</span>
<span>STATUS: AGGRAVATING</span>
</div>

</header>

<div class="layout">

<div class="inputPanel">

<h2>INPUT CHAOS</h2>

<textarea id="entryInput"
placeholder="What's the next annoying update?"></textarea>

<button id="addBtn">LOG CHAOS</button>

</div>

<div class="logPanel">

<h2>LOG STREAM</h2>

<div id="logContainer"></div>

</div>

</div>

</div>

<button id="aliveBtn">
STILL ALIVE? PROVE IT
</button>

<script src="journal.js"></script>

</body>
</html>
